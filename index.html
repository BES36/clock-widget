<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Widget</title>
    <style>
        @font-face {
            font-family: 'Samsung Sharp Sans';
            src: url('samsungsharpsans.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }

        body {
            margin: 0;
            background-color: rgba(0, 0, 0, 0);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #widget-container {
            font-family: 'Samsung Sharp Sans', sans-serif;
            color: #ffffff;
            font-size: 60px;
            font-weight: 900;
            text-align: center;
            white-space: nowrap;
            letter-spacing: 5px;
            /* Добавляем совсем немного жирности через микро-обводку */
            -webkit-text-stroke: 1px #ffffff;
            /* Легкая тень для четкости */
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <div id="widget-container">
        <span id="display-text">00:00</span>
    </div>

    <script>
        const displayText = document.getElementById('display-text');
        let currentTemperature = "...";
        let displayMode = "time";

        const API_KEY = '72870cfd1ca3406cb78155025262609';

        function updateTemperatureFromBridge() {
            fetch(`https://api.weatherapi.com/v1/current.json?key=${API_KEY}&q=Irkutsk&aqi=no`)
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(data => {
                    if (data && data.current && typeof data.current.temp_c === 'number') {
                        let num = data.current.temp_c;
                        let formatted = Math.abs(num).toFixed(1);
                        if (num > 0) {
                            currentTemperature = `+${formatted}`;
                        } else if (num < 0) {
                            currentTemperature = `-${formatted}`;
                        } else {
                            currentTemperature = `0.0`;
                        }
                    }
                })
                .catch(err => {
                    console.error(err);
                    currentTemperature = "ERR_NET";
                });
        }

        function getIrkutskTime() {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('ru-RU', {
                timeZone: 'Asia/Irkutsk',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
            return formatter.format(now);
        }

        function updateWidget() {
            if (displayMode === "time") {
                displayText.innerText = getIrkutskTime();
            } else {
                displayText.innerText = currentTemperature;
            }
        }

        // Переключение время / погода каждые 5 секунд
        setInterval(() => {
            displayMode = displayMode === "time" ? "weather" : "time";
            updateWidget();
        }, 5000);

        // Обновление погоды раз в 10 минут
        updateTemperatureFromBridge();
        setInterval(updateTemperatureFromBridge, 10 * 60 * 1000);

        // Обновление времени каждую секунду
        setInterval(updateWidget, 1000);
        updateWidget();
    </script>
</body>
</html>
