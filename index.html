<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Widget</title>
    <style>
        @font-face {
            font-family: 'Samsung Sharp Sans';
            src: url('samsungsharpsans.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }

        body {
            margin: 0;
            background-color: rgba(0, 0, 0, 0);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #widget-container {
            font-family: 'Samsung Sharp Sans', 'Arial Black', sans-serif;
            color: #ffffff;
            font-size: 64px;
            font-weight: bold;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6), 0px 0px 4px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
        }

        /* Прячем встроенные иконки информера, оставляем только цифры */
        #weather-box {
            display: inline-block;
            line-height: 1;
        }
    </style>
</head>
<body>

    <div id="widget-container">
        <span id="display-text">00:00</span>
    </div>

    <!-- Подключаем независимый информер погоды Иркутска, который обходит любые блокировки CORS -->
    <div id="weather-data-bridge" style="display:none;">
        <a href="https://yandex.ru" target="_blank">
            <img id="weather-img" src="https://yandex.ru" border="0" alt=""/>
        </a>
    </div>

    <script>
        const displayText = document.getElementById('display-text');
        let currentTemperature = "--.-";
        let displayMode = "time";

        // Глобальная функция-колбэк для обхода CORS
        window.processWeather = function(data) {
            if (data && data.current && typeof data.current.temperature_2m === 'number') {
                const num = data.current.temperature_2m;
                let formatted = Math.abs(num).toFixed(1);
                if (num > 0) {
                    currentTemperature = `+${formatted}`;
                } else if (num < 0) {
                    currentTemperature = `-${formatted}`;
                } else {
                    currentTemperature = `0.0`;
                }
            }
        };

        // Загрузка погоды через динамический тег <script> (100% обход CORS)
        function updateTemperatureFromBridge() {
            const oldScript = document.getElementById('weather-script');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'weather-script';
            script.src = `https://api.open-meteo.com/v1/forecast?latitude=52.2978&longitude=104.2964&current=temperature_2m&timeformat=unixtime&callback=processWeather&_=${Date.now()}`;
            document.body.appendChild(script);
        }

        function getIrkutskTime() {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('ru-RU', {
                timeZone: 'Asia/Irkutsk',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
            return formatter.format(now);
        }

        function updateWidget() {
            if (displayMode === "time") {
                displayText.innerText = getIrkutskTime();
            } else {
                displayText.innerText = currentTemperature;
            }
        }

        // Резкая смена без анимаций каждые 5 секунд
        setInterval(() => {
            displayMode = displayMode === "time" ? "weather" : "time";
            updateWidget();
        }, 5000);

        // Обновляем погоду раз в 10 минут
        updateTemperatureFromBridge();
        setInterval(updateTemperatureFromBridge, 10 * 60 * 1000);

        // Обновляем время каждую секунду
        setInterval(updateWidget, 1000);
        updateWidget();
    </script>
</body>
</html>
