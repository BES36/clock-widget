<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Widget</title>
    <style>
        @font-face {
            font-family: 'Samsung Sharp Sans';
            src: url('samsungsharpsans.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }

        body {
            margin: 0;
            background-color: rgba(0, 0, 0, 0);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #widget-container {
            font-family: 'Samsung Sharp Sans', 'Arial Black', sans-serif;
            color: #ffffff;
            font-size: 64px;
            font-weight: bold;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6), 0px 0px 4px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="widget-container">
        <span id="display-text">00:00</span>
    </div>

    <script>
        const displayText = document.getElementById('display-text');
        let currentTemperature = "LOADING...";
        let displayMode = "time";

        function updateTemperatureFromBridge() {
            // Прямой запрос температуры Иркутска (52.2978, 104.2964)
            fetch('https://api.open-meteo.com/v1/forecast?latitude=52.2978&longitude=104.2964&current_weather=true')
                .then(res => {
                    if (!res.ok) throw new Error('HTTP status ' + res.status);
                    return res.json();
                })
                .then(data => {
                    if (data && data.current_weather && typeof data.current_weather.temperature === 'number') {
                        let num = data.current_weather.temperature;
                        let formatted = Math.abs(num).toFixed(1);
                        if (num > 0) {
                            currentTemperature = `+${formatted}`;
                        } else if (num < 0) {
                            currentTemperature = `-${formatted}`;
                        } else {
                            currentTemperature = `0.0`;
                        }
                    } else {
                        currentTemperature = "ERR_DATA";
                    }
                })
                .catch(err => {
                    // Если запрос упал, выводим ошибку на экран, чтобы понять причину
                    currentTemperature = "ERR_NET";
                    console.error("Weather Fetch Error:", err);
                });
        }

        function getIrkutskTime() {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('ru-RU', {
                timeZone: 'Asia/Irkutsk',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
            return formatter.format(now);
        }

        function updateWidget() {
            if (displayMode === "time") {
                displayText.innerText = getIrkutskTime();
            } else {
                displayText.innerText = currentTemperature;
            }
        }

        // Переключение время / погода каждые 5 секунд
        setInterval(() => {
            displayMode = displayMode === "time" ? "weather" : "time";
            updateWidget();
        }, 5000);

        // Обновляем погоду раз в 5 минут
        updateTemperatureFromBridge();
        setInterval(updateTemperatureFromBridge, 5 * 60 * 1000);

        // Обновляем время каждую секунду
        setInterval(updateWidget, 1000);
        updateWidget();
    </script>
</body>
</html>
